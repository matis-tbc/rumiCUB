[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rumicub"
version = "0.1.0"
description = "Rummikub game engine with solver, strategy advisor, and probability analysis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/rumicub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
