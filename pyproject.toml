[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rumicub"
version = "0.3.0"
description = "rumiCUBE — Rummikub engine + ILP solver + bot framework + cube-themed web UI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# ILP board-manipulation solver (engine/ilp_solver.py). The hand-only solver
# in engine/solver.py works without this extra.
solver = ["pulp>=3.0"]
# Web backend (FastAPI). The CLI/library doesn't need this.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "pytest-benchmark>=4.0",
    "pulp>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "httpx>=0.27",  # for FastAPI TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["src/rumicub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
